<!DOCTYPE html>
<html>
<head>
    <title>Simple WebSocket Test</title>
</head>
<body>
    <h1>Simple WebSocket Test</h1>
    <div id="status">Connecting...</div>
    <div id="messages"></div>
    
    <script src="https://js.pusher.com/8.2.0/pusher.min.js"></script>
    <script>
        const pusher = new Pusher('localkey', {
            wsHost: 'localhost',
            wsPort: 6001,
            wssPort: 6001,
            forceTLS: false,
            disableStats: true,
            enabledTransports: ['ws', 'wss'],
            cluster: 'mt1'
        });

        pusher.connection.bind('state_change', (state) => {
            console.log('Connection state:', state.previous, '→', state.current);
            document.getElementById('status').textContent = `Status: ${state.current}`;
        });

        pusher.connection.bind('connected', () => {
            console.log('Connected to WebSocket!');
            document.getElementById('status').textContent = 'Status: Connected ✅';
        });

        pusher.connection.bind('error', (error) => {
            console.error('WebSocket error:', error);
            document.getElementById('status').textContent = `Status: Error - ${error.message}`;
        });

        // Test private channel
        const channel = pusher.subscribe('private-chat.dm.1');
        
        channel.bind('pusher:subscription_succeeded', () => {
            console.log('Successfully subscribed to private-chat.dm.1');
            document.getElementById('messages').innerHTML += '<p>✅ Subscribed to private-chat.dm.1</p>';
        });

        channel.bind('pusher:subscription_error', (error) => {
            console.error('Subscription error:', error);
            document.getElementById('messages').innerHTML += `<p>❌ Subscription error: ${error.message}</p>`;
        });

        // Test sending a message
        setTimeout(() => {
            if (pusher.connection.state === 'connected') {
                console.log('Sending test message...');
                channel.trigger('client-send-message', {
                    conversation_id: 1,
                    content: 'Test message from HTML',
                    type: 'text',
                    sender_id: 1
                });
                document.getElementById('messages').innerHTML += '<p>📤 Sent test message</p>';
            }
        }, 2000);
    </script>
</body>
</html>
